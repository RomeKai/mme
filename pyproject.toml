[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mme-harness"
version = "0.2.0"
description = "Budget-safe agent harness kit for building with the Meta Model API on top of ECC: gateway budgets, circuit breakers, night missions, delivery gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["agents", "claude-code", "ecc", "meta", "muse", "litellm", "harness", "budget"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
mme = "mme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mme = [
  "providers/*.json",
  "gateway/*.sh",
  "gateway/*.yml",
  "templates/*.md",
  "templates/project/**/*",
]
